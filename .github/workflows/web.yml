# Publishes the web version of the app to GitHub Pages:
# https://fabienfior.github.io/absolute-racing-app/
# Runs on every change to main (or by hand from the Actions tab).
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site lives under /<repo>/, not at the root of the domain.
      - run: |
          jq --arg b "$BASE_URL" '.expo.experiments.baseUrl = $b' app.json > app.tmp.json && mv app.tmp.json app.json
      - run: npx expo export -p web
        env:
          EXPO_PUBLIC_BASE_URL: ${{ env.BASE_URL }}
      # Single-page app: unknown paths fall back to the app itself.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
